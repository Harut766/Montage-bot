# Logs are capped so they never grow without bound (Docker keeps them forever by default).
x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  # Local Bot API Server: lets the bot receive and send files up to 2 GB (public API: 20 MB / 50 MB).
  telegram-bot-api:
    image: aiogram/telegram-bot-api:latest
    restart: unless-stopped
    logging: *logging
    environment:
      TELEGRAM_API_ID: ${TELEGRAM_API_ID}
      TELEGRAM_API_HASH: ${TELEGRAM_API_HASH}
      TELEGRAM_LOCAL: "1"
    volumes:
      - tg-api-data:/var/lib/telegram-bot-api

  bot:
    build: .
    restart: unless-stopped
    logging: *logging
    env_file: .env
    environment:
      TELEGRAM_API_URL: http://telegram-bot-api:8081
    volumes:
      # Same path as in telegram-bot-api: uploaded videos are read directly from its storage.
      - tg-api-data:/var/lib/telegram-bot-api
      - work:/data
      - whisper-models:/root/.cache/huggingface
    extra_hosts:
      # n8n runs in its own Docker container and publishes port 5678 on the host.
      - "host.docker.internal:host-gateway"
    depends_on:
      - telegram-bot-api

volumes:
  tg-api-data:
  work:
  whisper-models:
